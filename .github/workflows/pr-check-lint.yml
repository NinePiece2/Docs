name: PR Lint Test

on:
  pull_request:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 25

      - name: Install dependencies
        run: npm install

      - name: Run lint
        env:
          CI: false
        run: npm run lint
